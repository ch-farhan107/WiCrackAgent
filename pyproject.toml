[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wicrack"
version = "1.0.0"
description = "Automated wireless security assessment framework — GPU+CPU dual engine, live web console, client-ready pentest reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ch-farhan107" }]
keywords = [
    "penetration-testing", "wifi-security", "wireless-security", "wpa2",
    "wpa3", "pmkid", "hashcat", "john-the-ripper", "kali-linux",
    "ethical-hacking", "cybersecurity", "pentest-tools", "handshake",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "typer>=0.12",
    "rich>=13.0",
    "loguru>=0.7",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "cryptography>=42.0",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/ch-farhan107/WiCrackAgent"
Documentation = "https://ch-farhan107.github.io/WiCrackAgent/"
Repository = "https://github.com/ch-farhan107/WiCrackAgent"
Changelog = "https://github.com/ch-farhan107/WiCrackAgent/blob/main/CHANGELOG.md"
"Issue Tracker" = "https://github.com/ch-farhan107/WiCrackAgent/issues"

[project.scripts]
wicrack = "wicrack.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
docs = ["mkdocs-material>=9.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wicrack = ["py.typed", "web/templates/*.html", "web/static/css/*.css",
           "web/static/js/*.js", "web/static/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = ["docs", "assets"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented idiom is Option()/Argument() calls in parameter defaults
"src/wicrack/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/wicrack"]
omit = ["*/web/templates/*"]

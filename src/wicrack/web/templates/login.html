{% extends "base.html" %}
{% block title %}Login — WiCrackAgent{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:60px auto">
  <h2 style="margin-top:0">🔐 Console Login</h2>
  {% if error %}<div class="flash" style="border-color:var(--danger);
     color:var(--danger)">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Console password</label>
    <input type="password" name="password" autofocus autocomplete="current-password">
    <p style="margin-top:14px"><button class="btn">Sign in</button></p>
  </form>
  <p class="muted" style="margin-top:16px;font-size:.8em">
    First run? The password was printed in the server terminal and stored in
    <code>data/web_state.json</code>. Change it in Settings.</p>
</div>
{% endblock %}

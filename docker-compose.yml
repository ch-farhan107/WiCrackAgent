services:
  wicrack:
    build: .
    image: wicrack:latest
    container_name: wicrack
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data          # results, potfile, vault, logs
      - ./wifi_captures:/app/wifi_captures
    restart: unless-stopped

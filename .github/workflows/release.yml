name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - name: Verify version tag matches package version
        run: |
          PKG_VER=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VER=${GITHUB_REF_NAME#v}
          [ "$PKG_VER" = "$TAG_VER" ] || { echo "tag $TAG_VER != package $PKG_VER"; exit 1; }
      - run: pytest
      - name: Build distributions
        run: python -m build
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: dist/*
          generate_release_notes: true
